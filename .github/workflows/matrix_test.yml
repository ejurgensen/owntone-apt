name: Matrix test
on:
  push:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      targets: ${{ steps.set-targets.outputs.targets }}
      packages: ${{ steps.set-packages.outputs.packages }}

    steps:
      - name: Define targets
        id: set-targets
        run: |
          echo 'targets=["big", "medium", "small"]' >> "$GITHUB_OUTPUT"

      - name: Define packages
        id: set-packages
        run: |
          echo 'packages=["red", "green", "blue"]' >> "$GITHUB_OUTPUT"

  setup:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        targets: ${{ fromJSON(needs.prepare.outputs.targets) }}

    steps:
      - name: Make pbuilder
        env:
          target: ${{ matrix.targets }}
        run: |
          echo "$target"
