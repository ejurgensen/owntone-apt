name: Matrix test
on:
  push:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      targets: ${{ steps.set-targets.outputs.targets }}
      packages: ${{ steps.set-packages.outputs.packages }}

    steps:
      - uses: actions/checkout@v6

      - name: Define targets
        id: set-targets
        run: |
          echo 'targets=["big", "medium", "small"]' >> "$GITHUB_OUTPUT"

      - name: Define packages
        id: set-packages
        run: |
          echo 'packages=[{"name":"green","version":"0.1"}, {"name":"red","version":"0.2"}]' >> "$GITHUB_OUTPUT"

  setup:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        targets: ${{ fromJSON(needs.prepare.outputs.targets) }}

    steps:
      - name: Make pbuilder
        env:
          target: ${{ matrix.targets }}
        run: |
          echo "$target"

  build:
    runs-on: ubuntu-latest
    needs: [prepare, setup]
    strategy:
      matrix:
        targets: ${{ fromJSON(needs.prepare.outputs.targets) }}
        packages: ${{ fromJSON(needs.prepare.outputs.packages) }}

    steps:
      - name: Make package
        env:
          target: ${{ matrix.targets }}
          package: ${{ matrix.packages.name }}
          version: ${{ matrix.packages.version }}
        run: |
          echo "Making $package v$version for $target"
