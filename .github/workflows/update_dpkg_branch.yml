name: Update Debian packages branch

on:
  workflow_dispatch:

jobs:
  update_dpkg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dpkg

      - name: Prepare directories
        run: |
          mkdir dl
          mkdir -p owntone-server
          mkdir -p airptpd

      - name: Download packages
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: create_dpkg_test2.yml
          workflow_conclusion: success
          path: dl
          name: "debian"
          name_is_regexp: true

      - name: Add incoming packages
        working-directory: dl
        run: |
          ls -lR ..
          find -name owntone_*.deb -type f -print0 | xargs -0 cp --update=none --target-directory=../owntone-server
          find -name airptpd_*.deb -type f -print0 | xargs -0 cp --update=none --target-directory=../airptpd
          ls -lR ..
